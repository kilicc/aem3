<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auction Helper</title>
  <!-- JavaScript ve (orijinal hâlinizde kullandığınız gibi) style.css -->
  <script src="popup.js" defer></script>
  
  <style>
    body {
      width: 350px; 
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #log-container {
  max-height: 110px;
  overflow-y: auto;
  background-color: #f9fafb;
  padding: 5px;
  border-radius: 5px;
  border: 1px solid #e5e7eb;
  font-family: monospace;
  font-size: 12px;
  color: #374151;
}

  </style>
  <script src="./style.css"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-2">
  <div class="bg-white shadow-lg rounded-lg p-6 max-w-md w-full border border-gray-200">
    <h1 class="text-3xl font-bold text-yellow-500 mb-6 text-center">MS</h1>

    <!-- Eklentiyi aktif/pasif etmek için checkbox -->
    <div class="flex items-center mb-4" style="display: none">
      <input type="checkbox" id="extension-status" class="mr-2" checked>
      <label for="extension-status" class="text-sm font-semibold text-gray-700">
        Eklentiyi Aktif Et
      </label>
    </div>

    <form id="auction-form" class="space-y-4">
      <div>
        <label for="max-bid" class="block text-sm font-semibold text-gray-700">Maksimum Teklif</label>
        <input type="number" id="max-bid" placeholder="Maksimum teklif girin"
          class="mt-2 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-yellow-500 focus:border-yellow-500 p-2">
      </div>
      

      <div>
        <label for="bid-increment">Teklif Artırma Fiyatı (TL)</label>
        <input type="number" id="bid-increment" placeholder="Maksimum teklif girin"
        class="mt-2 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-yellow-500 focus:border-yellow-500 p-2">
      </div>
      

      <div>
        <label for="end-time" class="block text-sm font-semibold text-gray-700">İhale Bitiş Saati</label>
        <input type="datetime-local" id="end-time"
          class="mt-2 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-yellow-500 focus:border-yellow-500 p-2">
      </div>

      <div>
        <label for="last-ms" class="block text-sm font-semibold text-gray-700">Son Milisaniye Ayarı</label>
        <input type="number" id="last-ms" placeholder="Milisaniye girin"
          class="mt-2 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-yellow-500 focus:border-yellow-500 p-2">
      </div>

      <button type="button" id="start-extension"
              class="w-full bg-green-500 text-white font-bold py-3 rounded-lg shadow-md hover:bg-yellow-600 focus:outline-none">
        Başlat
      </button>
      <!-- Durdur -->
      <button type="button" id="stop-extension"
              class="w-full bg-red-400 text-white font-bold py-3 rounded-lg shadow-md hover:bg-gray-500 focus:outline-none mt-2">
        Durdur
      </button>
    </form>
  </div>
</body>
</html>
